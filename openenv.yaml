name: "AutoSRE"
version: "1.0.0"
description: "A professional Microservices SRE simulation with cascading failures."
entry_point: "server:app"
sdk_version: "openenv-0.1.0"
metadata:
  category: "DevOps/SRE"
  difficulty: "Hard"
  tags: ["Microservices", "Incident Response", "Control Plane"]
runtime:
  port: 7860
  resource_limits:
    vcpu: 2
    memory_gb: 8
  execution_timeout_minutes: 20

tasks:
  - id: task_1_easy
    task_id: task_1_easy
    name: task_1_easy
    description: "Simple Service Failure: The 'payment-service' has crashed. Restart it to restore service."
    grader: "server.graders:EasyGrader"
    grader_enabled: true
    has_grader: true
    score_range:
      min_exclusive: 0.0
      max_exclusive: 1.0

  - id: task_2_medium
    task_id: task_2_medium
    name: task_2_medium
    description: "Resource Exhaustion: The 'auth-service' is experiencing a memory leak (95% RAM). Clear the cache and scale up to stabilize."
    grader: "server.graders:MediumGrader"
    grader_enabled: true
    has_grader: true
    score_range:
      min_exclusive: 0.0
      max_exclusive: 1.0

  - id: task_3_hard
    task_id: task_3_hard
    name: task_3_hard
    description: "Cascading Failure: The 'database' is overwhelmed with high latency (>800ms), causing the 'api-gateway' to crash. You MUST fix the Database FIRST."
    grader: "server.graders:HardGrader"
    grader_enabled: true
    has_grader: true
    score_range:
      min_exclusive: 0.0
      max_exclusive: 1.0
